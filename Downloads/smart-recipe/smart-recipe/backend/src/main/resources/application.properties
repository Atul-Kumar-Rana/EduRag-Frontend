# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/smart_recipe_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
jwt.secret=SmartRecipeSecretKey2024VeryLongSecretKeyForJWTSigning
jwt.expiration=86400000

# CORS
spring.web.cors.allowed-origins=http://localhost:3000

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.smartrecipe=DEBUG

